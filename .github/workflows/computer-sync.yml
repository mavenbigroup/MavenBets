name: Computer book sync

# Pulls lines, graded bets and open bets from king23.ag into computer.json (read-only).
# Runs ONLY when the app asks (opening it or tapping Refresh on a booker phone) or when you click Run workflow.
# Makes one sign-in attempt per run; after a rejected sign-in it stays off until you tick "Try signing in again".
on:
  workflow_dispatch:
    inputs:
      retry:
        description: 'Try signing in again (only after fixing the username/password secrets)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: computer-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull from king23
        env:
          K23_USER: ${{ secrets.K23_USER }}
          K23_PASS: ${{ secrets.K23_PASS }}
          K23_RETRY: ${{ inputs.retry }}
        run: node computer-sync.mjs
      - name: Save computer.json
        if: always()
        run: |
          [ -f computer.json ] || exit 0
          git config user.name "computer-sync"
          git config user.email "computer-sync@users.noreply.github.com"
          git add computer.json
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Computer book sync"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
