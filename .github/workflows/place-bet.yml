name: Place king23 bet

# Started by the app's "Send to king23" (booker phones only). One bet per run.
# STAGE 1: test mode only — place-bet.mjs never contacts king23 and is given no password.
on:
  workflow_dispatch:
    inputs:
      bet:
        description: 'Bet (sent by the app)'
        required: true
        type: string
      mode:
        description: 'test or live'
        required: true
        default: 'test'
        type: string

permissions:
  contents: write

concurrency:
  group: king23
  cancel-in-progress: false

jobs:
  place:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check and place
        env:
          BET: ${{ inputs.bet }}
          MODE: ${{ inputs.mode }}
        run: node place-bet.mjs
      - name: Save result
        if: always()
        run: |
          [ -f placements.json ] || exit 0
          git config user.name "place-bet"
          git config user.email "place-bet@users.noreply.github.com"
          git add placements.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "king23 placement result"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
